[project]
name = "aws-waste-finder"
version = "2.0.0"
description = "Read-only scanner that finds idle and orphaned AWS resources and prices each one per month."
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]
license = { text = "MIT" }

[project.scripts]
waste-finder = "waste_finder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
